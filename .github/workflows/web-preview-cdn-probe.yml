name: Web preview CDN probe

on:
  push:
    branches:
      - feat/godot-guild-ui-pilot
    paths:
      - ".github/workflows/web-preview-cdn-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public HTML and WASM hosting candidates
        shell: bash
        run: |
          set +e
          sha="968ea1c"
          path="levian47/riskfate-the-living-guild"
          urls=(
            "https://raw.githack.com/$path/main/index.html"
            "https://raw.githack.com/$path/preview/godot-pr16-web/godot-preview/index.html"
            "https://rawcdn.githack.com/$path/$sha/godot-preview/index.html"
            "https://cdn.statically.io/gh/$path/$sha/godot-preview/index.html"
            "https://cdn.jsdelivr.net/gh/$path@$sha/godot-preview/index.html"
            "https://fastly.jsdelivr.net/gh/$path@$sha/godot-preview/index.html"
            "https://levian47.github.io/riskfate-the-living-guild/godot-preview/index.html"
          )
          for url in "${urls[@]}"; do
            echo "--- $url"
            curl --location --max-time 15 --silent --show-error \
              --output /dev/null --write-out "HTTP=%{http_code} ContentType=%{content_type} Size=%{size_download} Redirects=%{num_redirects}\\n" \
              "$url" || true
          done
