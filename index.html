const buildings=[['market','Ринок','Торгівля між гравцями','market'],['beer','Таверна','Наймання та відпочинок','tavern'],['anvil','Коваль','Купівля й ремонт спорядження','smith'],['flask','Алхімік','Зілля та інгредієнти','alchemist'],['shield','Гільдія','Герої, накази, розвиток','guild'],['bank','Банк','Міські фінансові послуги','bank'],['mail','Дошка оголошень','Замовлення та завдання','quests'],['gate','Міська брама','Шлях до локацій','map']];
const HEROES=[{name:'Торен',cls:'Воїн',level:8,state:'Полює · Темний ліс',hp:72,mp:35,mpmax:60,command:[]},{name:'Еліра',cls:'Мисливиця',level:6,state:'Повертається до міста',hp:46,mp:38,mpmax:50,command:[]},{name:'Бран',cls:'Збирач',level:4,state:'Відпочиває у таверні',hp:91,mp:22,mpmax:40,command:[]}];
const INITIAL_INVENTORY=[['Залізна руда','Сировина',86,'шт.'],['Деревина','Сировина',48,'шт.'],['Лікарські трави','Сировина',34,'шт.'],['Шкіра вовка','Трофеї',21,'шт.'],['Малий еліксир здоров’я','Витратні',12,'шт.'],['Залізний меч','Спорядження',3,'шт.'],['Шкіряний обладунок','Спорядження',2,'шт.']];
const RECIPES=[{id:'sword',name:'Залізний меч',cost:'4 залізної руди · 2 деревини',use:{'Залізна руда':4,'Деревина':2},time:12,icon:'sword'},{id:'potion',name:'Малий еліксир здоров’я',cost:'3 лікарські трави',use:{'Лікарські трави':3},time:7,icon:'flask'},{id:'armor',name:'Шкіряний обладунок',cost:'5 шкур вовка',use:{'Шкіра вовка':5},time:18,icon:'shield'}];
const initial=()=>({page:'city',hero:0,inventory:INITIAL_INVENTORY.map(([name,category,qty,unit])=>({name,category,qty,unit})),production:[{name:'Заточування мечів',time:'8 хв',status:'У роботі'}],orders:[],commands:[[],[],[]],activity:[{name:'З’явилося нове замовлення на ринку',time:'10 хв тому'},{name:'У таверні доступні нові найманці',time:'27 хв тому'},{name:'Зміна ціни на залізну руду',time:'1 год тому'},{name:'Прибула караванна група',time:'2 год тому'}],policies:{autosell:true,autobuy:false},guildGold:1840,filter:'',showMarket:'all'});
let state=initial();try{const raw=JSON.parse(localStorage.getItem('riskfate_ui_demo_v01')||'null');if(raw&&typeof raw==='object'){state={...state,...raw,page:NAV.some(n=>n[0]===raw.page)?raw.page:'city'};state.commands=Array.isArray(raw.commands)&&raw.commands.length===3?raw.commands:[[],[],[]];}}catch(_e){}
function save(){try{localStorage.setItem('riskfate_ui_demo_v01',JSON.stringify(state))}catch(_e){}}
function money(n){return Number(n).toLocaleString('uk-UA')}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function metric(label,value,sym,detail){return `<div class="metric"><div class="metric-top"><span>${label}</span>${icon(sym,17)}</div><strong>${value}<em>${detail||''}</em></strong></div>`}
function header(eyebrow,title,sub,tag=''){return `<div class="heading-row"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${tag?`<span class="small-tag">${tag}</span>`:''}</div>`}
function panel(title,ico,body,action=''){return `<section class="panel"><div class="panel-head"><h2>${icon(ico)}${title}</h2>${action}</div>${body}</section>`}
function renderNav(){document.getElementById('nav').innerHTML=NAV.map(([id,label,ic])=>`<button type="button" class="nav-button ${state.page===id?'active':''}" data-nav="${id}" ${state.page===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}
function render(){renderNav();let entry=NAV.find(n=>n[0]===state.page)||NAV[0];document.getElementById('pagetitle').textContent=entry[1];document.getElementById('pageglyph').innerHTML=icon(entry[2],25);document.getElementById('goldbadge').innerHTML=icon('coin')+money(state.guildGold);document.getElementById('resbadge').innerHTML=icon('gem')+'Гільдія · III';document.getElementById('main').innerHTML=({city:renderCity,guild:renderGuild,heroes:renderHeroes,warehouse:renderWarehouse,production:renderProduction,market:renderMarket,quests:renderQuests,map:renderMap,stats:renderStats}[state.page]||renderCity)();save()}
function cityBuildings(){return buildings.map(([ico,name,description,target])=>`<button class="tile" type="button" data-building="${target}"><span class="icon-frame">${icon(ico)}</span><strong>${name}</strong><span>${description}</span></button>`).join('')}
function activityPanel(){return panel('Події міста','calendar',`<div class="panel-body">${state.activity.slice(0,5).map(e=>`<div class="rowline event-line"><span class="event-dot"></span><div class="details"><strong>${safe(e.name)}</strong><small>${safe(e.time)}</small></div></div>`).join('')}</div>`)}
function renderCity(){return header('Світ / центральне місто','Місто Варден','Торгові установи, служби та виходи у світ — без окремої графічної сцени.','Відкриті установи')+`<div class="metrics">${metric('Золото гільдії',money(state.guildGold),'coin','монет')}${metric('Активні герої','2 / 3','heroes','')}${metric('Доступні замовлення','6','scroll','')}${metric('Виробничі процеси',String(state.production.length),'anvil','')}</div><div class="content-grid"><div class="stack">${panel('Установи та місця','city',`<div class="tiles">${cityBuildings()}</div>`)}${panel('Міські оголошення','mail',`<div class="panel-body"><div class="rowline"><div class="details"><strong>Потрібні лікарські трави</strong><small>Демонстраційний контракт · дошка замовлень</small></div><span class="trailing">до 35 монет</span></div><div class="rowline"><div class="details"><strong>Експедиція до старої дороги</strong><small>Завдання · рекомендований рівень 4+</small></div><button class="button secondary tiny" data-nav="quests">Відкрити</button></div></div>`)}</div><div class="stack">${activityPanel()}${panel('Ринок · огляд','market',`<div class="panel-body"><div class="rowline"><div class="details"><strong>Залізна руда</strong><small>Орієнтовна ціна</small></div><div class="trailing">12 <span class="up">+4%</span></div></div><div class="rowline"><div class="details"><strong>Деревина</strong><small>Орієнтовна ціна</small></div><div class="trailing">7 <span class="down">−2%</span></div></div><div class="rowline"><div class="details"><strong>Мале зілля</strong><small>Орієнтовна ціна</small></div><div class="trailing">28 <span class="up">+1%</span></div></div><button class="button secondary" style="width:100%;margin-top:14px" data-nav="market">Перейти на ринок</button></div>`)}</div></div>`}
function guildHeroes(){return HEROES.map((h,i)=>`<div class="hero-row"><div class="avatar">${h.name[0]}</div><div><strong>${h.name} <span class="muted">· ${h.cls}, р. ${h.level}</span></strong><small>${h.state}</small></div><button class="button ghost tiny" data-openhero="${i}">Накази</button></div>`).join('')}
function renderGuild(){return header('Керування / моя гільдія','Гільдія «Срібний шлях»','Герої, ресурси, виробництво та економічні правила в одному місці.','Ранг III')+`<div class="metrics">${metric('Баланс',money(state.guildGold),'coin','монет')}${metric('Герої','3 / 3','heroes','')}${metric('Запаси ресурсів',state.inventory.reduce((a,b)=>a+b.qty,0),'warehouse','од.')}${metric('Активні процеси',String(state.production.length),'clock','')}</div><div class="content-grid"><div class="stack">${panel('Розвиток гільдії','guild',`<div class="panel-body"><div class="split-label"><strong>Репутація · рівень 3</strong><span class="muted">6 320 / 8 000</span></div><div class="progress"><div style="width:79%"></div></div><div class="rowline"><div class="details"><strong>Спеціалізація</strong><small>Виробництво й експедиції</small></div><span class="pill ash">Демо</span></div><div class="rowline"><div class="details"><strong>Місць для героїв</strong><small>3 найнято · 3 доступно</small></div><span class="trailing">3 / 3</span></div></div>`)}${panel('Герої гільдії','heroes',`<div class="panel-body">${guildHeroes()}<button class="button secondary spaced" data-nav="heroes">Управління героями</button></div>`)}${panel('Розділи управління','settings',`<div class="panel-body"><div class="quicklist"><button class="quick" data-nav="warehouse">${icon('warehouse')}Склад</button><button class="quick" data-nav="production">${icon('anvil')}Виробництво</button><button class="quick" data-nav="market">${icon('market')}Торгівля</button><button class="quick" data-nav="heroes">${icon('heroes')}Накази</button><button class="quick" data-nav="quests">${icon('quests')}Завдання</button><button class="quick" data-nav="stats">${icon('stats')}Звіти</button></div></div>`)}</div><div class="stack">${panel('Черги та процеси','clock',`<div class="panel-body">${state.production.length?state.production.slice(0,5).map(p=>`<div class="activity">${icon('anvil')}<div><strong>${safe(p.name)}</strong><small>${safe(p.status)} · ${safe(p.time)}</small></div></div>`).join(''):'<div class="no-data">Активних процесів немає</div>'}<button class="button secondary spaced" data-nav="production">Відкрити виробництво</button></div>`)}${panel('Економічні правила','settings',`<div class="panel-body"><div class="rowline"><div class="details"><strong>Автоматичний продаж надлишків</strong><small>Лише демонстрація перемикача</small></div><input aria-label="Автоматичний продаж" type="checkbox" data-policy="autosell" ${state.policies.autosell?'checked':''}></div><div class="rowline"><div class="details"><strong>Автоматична закупівля</strong><small>Лише демонстрація перемикача</small></div><input aria-label="Автоматична закупівля" type="checkbox" data-policy="autobuy" ${state.policies.autobuy?'checked':''}></div><p class="help">У реальній грі потрібні ціни, ліміти й правила. Тут угоди не виконуються.</p></div>`)}</div></div>`}
function renderHeroes(){let h=HEROES[state.hero];return header('Гільдія / герої','Управління героями','Вибирай персонажа, переглядай стан і формуй чергу прямих наказів.','Алгоритм автономний')+`<div class="content-grid"><div class="stack">${panel('Склад гільдії','heroes',`<div class="panel-body"><div class="hero-picker">${HEROES.map((v,i)=>`<button class="hero-option ${state.hero===i?'active':''}" data-openhero="${i}"><strong>${v.name}</strong><small>${v.cls} · рівень ${v.level}</small><small>HP ${v.hp}%</small></button>`).join('')}</div></div>`)}${panel('Картка героя','shield',`<div class="panel-body"><div class="selected-hero"><div class="selected-hero-head"><div class="avatar" style="width:52px;height:52px;font-size:23px">${h.name[0]}</div><div><h3>${h.name}</h3><div class="muted">${h.cls} · рівень ${h.level}</div><div class="pill spaced">${safe(h.state)}</div></div></div><div class="bars"><div><div class="bar-label"><span>Здоров'я</span><span>${h.hp} / 100</span></div><div class="bar"><span style="width:${h.hp}%"></span></div></div><div><div class="bar-label"><span>Мана</span><span>${h.mp} / ${h.mpmax}</span></div><div class="bar blue"><span style="width:${Math.round(h.mp/h.mpmax*100)}%"></span></div></div></div></div><div class="quicklist spaced"><button class="quick" data-modal="inventory">${icon('package')}Інвентар</button><button class="quick" data-modal="equip">${icon('shield')}Екіпірування</button><button class="quick" data-modal="skills">${icon('spark')}Навички</button></div></div>`)}${panel('Черга наказів','scroll',`<div class="panel-body">${state.commands[state.hero].length?state.commands[state.hero].map((c,i)=>`<div class="rowline"><div class="details"><strong>${i+1}. ${safe(c)}</strong><small>Заплановано · демонстрація</small></div><button class="button ghost tiny" data-removecommand="${i}" aria-label="Видалити наказ ${i+1}">${icon('cross',13)}</button></div>`).join(''):'<p class="muted">Немає додаткових наказів. Герой діє за автономним алгоритмом.</p>'}</div>`)}</div><div class="stack">${panel('Прямий наказ','arrow',`<form class="panel-body" id="commandForm"><label class="field"><span>Дія героя</span><select name="cmd" id="commandSelect"><option value="Повернутися в місто">Повернутися в місто</option><option value="Прийти в гільдію">Прийти в гільдію</option><option value="Відпочити">Відпочити</option><option value="Продати дозволені ресурси">Продати ресурси</option><option value="Купити предмет">Купити предмет</option><option value="Вирушити на розвідку">Вирушити на розвідку</option></select></label><div class="field spaced" id="purchaseField" hidden><span>Назва предмета</span><input name="item" maxlength="60" placeholder="Наприклад, залізний меч"></div><div class="field spaced" id="priceField" hidden><span>Максимальна ціна (монет)</span><input name="maxprice" type="number" min="1" max="1000000" value="100"></div><button class="button spaced" style="width:100%" type="submit">Додати до черги наказів</button><p class="help">Команди зберігаються лише в локальному демонстраційному стані.</p></form>`)}${panel('Пріоритети алгоритму','clock',`<div class="panel-body"><div class="activity">${icon('shield')}<div><strong>1. Безпека героя</strong><small>Відступ і збереження життя</small></div></div><div class="activity">${icon('arrow')}<div><strong>2. Прямі накази</strong><small>Після безпечного завершення дії</small></div></div><div class="activity">${icon('clock')}<div><strong>3. Автономний цикл</strong><small>Підготовка → експедиція → повернення → відпочинок</small></div></div></div>`)}</div></div>`}
function renderWarehouse(){let filtered=state.inventory.filter(x=>x.name.toLocaleLowerCase('uk-UA').includes(state.filter.toLocaleLowerCase('uk-UA')));return header('Гільдія / запаси','Склад гільдії','Персональні інвентарі героїв і склад мають окремі місця зберігання, але спільного власника — гільдію.','Демонстраційні запаси')+`<div class="metrics">${metric('Усього одиниць',state.inventory.reduce((a,b)=>a+b.qty,0),'warehouse','шт.')}${metric('Найменувань',state.inventory.length,'package','')}${metric('Сировина',state.inventory.filter(x=>x.category==='Сировина').reduce((a,b)=>a+b.qty,0),'anvil','шт.')}${metric('Заявок на продаж',state.orders.filter(o=>o.type==='Продаж').length,'market','')}</div>${panel('Облік ресурсів','warehouse',`<div class="panel-body"><label class="field"><span>Пошук у складі</span><input id="warehouseSearch" value="${safe(state.filter)}" placeholder="Назва ресурсу або предмета"></label><div class="table-wrap spaced"><table class="data-table"><thead><tr><th>Предмет</th><th>Категорія</th><th class="num">Кількість</th></tr></thead><tbody id="warehouseRows">${renderWarehouseRows(filtered)}</tbody></table></div><p class="help">У прототипі склад змінюється після створення демонстраційного виробничого замовлення.</p></div>`)}`}
function renderWarehouseRows(filtered){return filtered.map(x=>`<tr><td>${safe(x.name)}</td><td class="muted">${safe(x.category)}</td><td class="num">${x.qty} ${safe(x.unit)}</td></tr>`).join('')||'<tr><td colspan="3" class="no-data">Нічого не знайдено</td></tr>'}
function renderProduction(){return header('Гільдія / ремесла','Виробництво','Створення предметів зі складських матеріалів. Черги та списання в цьому файлі — лише локальна симуляція.','Без реального таймера')+`<div class="content-grid"><div class="stack">${panel('Рецепти майстерень','anvil',`<div class="panel-body">${RECIPES.map(r=>`<div class="recipe"><div class="recipe-icon">${icon(r.icon)}</div><div class="recipe-main"><strong>${r.name}</strong><small>${r.cost} · умовно ${r.time} хв</small></div><button class="button tiny" data-recipe="${r.id}">Виготовити</button></div>`).join('')}</div>`)}${panel('Модель економіки','info',`<div class="panel-body"><p class="muted" style="margin:0">Виробництво бере сировину зі складу гільдії. Передача матеріалів між власними установами не є зовнішньою купівлею або продажем.</p></div>`)}</div><div class="stack">${panel('Черги майстерень','clock',`<div class="panel-body">${state.production.length?state.production.map((p,i)=>`<div class="activity">${icon('anvil')}<div style="flex:1"><strong>${safe(p.name)}</strong><small>${safe(p.status)} · ${safe(p.time)}</small></div>${p.status==='Заплановано'?`<button class="button ghost tiny" data-complete="${i}">Завершити</button>`:''}</div>`).join(''):'<div class="no-data">Черга порожня</div>'}<p class="help">Кнопка «Завершити» моделює отримання предмета, без серверного часу.</p></div>`)}${panel('Ключові запаси','package',`<div class="panel-body">${state.inventory.filter(x=>x.category==='Сировина').map(x=>`<div class="rowline"><strong>${safe(x.name)}</strong><span class="trailing">${x.qty} шт.</span></div>`).join('')}</div>`)}</div></div>`}
const goods=[{name:'Залізна руда',price:12,qty:210,side:'Продаж'},{name:'Деревина',price:7,qty:98,side:'Продаж'},{name:'Лікарські трави',price:14,qty:75,side:'Продаж'},{name:'Залізний меч',price:98,qty:8,side:'Продаж'},{name:'Шкіра вовка',price:11,qty:65,side:'Купівля'}];
function renderMarket(){let filtered=goods.filter(g=>state.showMarket==='all'||g.side===(state.showMarket==='sell'?'Продаж':'Купівля'));return header('Зовнішня економіка / торговий майданчик','Спільний ринок','У майбутньому тут торгуватимуть реальні гільдії. Наразі відображені тільки умовні пропозиції.','Без онлайн-торгівлі')+`<div class="content-grid"><div class="stack">${panel('Пропозиції ринку','market',`<div class="panel-body"><label class="field" style="max-width:230px"><span>Фільтр заявок</span><select id="marketFilter"><option value="all" ${state.showMarket==='all'?'selected':''}>Усі заявки</option><option value="sell" ${state.showMarket==='sell'?'selected':''}>Продають</option><option value="buy" ${state.showMarket==='buy'?'selected':''}>Купують</option></select></label><div class="table-wrap spaced"><table class="data-table"><thead><tr><th>Товар</th><th>Тип</th><th class="num">Кількість</th><th class="num">Ціна / шт.</th></tr></thead><tbody>${filtered.map(g=>`<tr><td>${g.name}</td><td class="muted">${g.side}</td><td class="num">${g.qty}</td><td class="num" style="color:var(--gold2)">${g.price}</td></tr>`).join('')}</tbody></table></div></div>`)}${panel('Мої демонстраційні заявки','scroll',`<div class="panel-body">${state.orders.length?state.orders.map((o,i)=>`<div class="rowline"><div class="details"><strong>${safe(o.type)} · ${safe(o.item)}</strong><small>${o.qty} шт. по ${o.price} монет</small></div><button class="button ghost tiny" data-cancelorder="${i}">Скасувати</button></div>`).join(''):'<p class="muted">Заявок ще немає.</p>'}</div>`)}</div><div class="stack">${panel('Створити заявку','plus',`<form id="marketForm" class="panel-body"><label class="field"><span>Тип заявки</span><select name="type"><option>Купівля</option><option>Продаж</option></select></label><label class="field spaced"><span>Товар</span><select name="item">${state.inventory.map(x=>`<option>${safe(x.name)}</option>`).join('')}</select></label><div class="dual spaced"><label class="field"><span>Кількість</span><input name="qty" type="number" min="1" max="99999" value="1" required></label><label class="field"><span>Ціна / шт.</span><input name="price" type="number" min="1" max="999999" value="10" required></label></div><button class="button spaced" type="submit" style="width:100%">Створити демозаявку</button><p class="help">Заявка не відправляється іншим гравцям і не резервує кошти чи товари.</p></form>`)}</div></div>`}
function renderQuests(){return header('Світ / замовлення','Завдання та контракти','Тут можуть з’являтися міські доручення й запити інших гільдій.','Демонстрація')+panel('Доступні завдання','quests',`<div class="panel-body">${[['Заготівля лікарських трав','Зібрати 12 трав для міського алхіміка','80 монет'],['Постачання деревини','Підготувати 20 одиниць деревини','95 монет'],['Патрулювання старої дороги','Виконати експедицію з воїном','130 монет']].map(v=>`<div class="rowline"><div class="details"><strong>${v[0]}</strong><small>${v[1]}</small></div><div class="trailing">${v[2]}<br><button class="button ghost tiny" data-demoquest="${safe(v[0])}">Переглянути</button></div></div>`).join('')}</div>`)}
function renderMap(){return header('Світ / локації','Карта локацій','Список зон з таймерами переміщення — без анімованої карти.','Розширення світу згодом')+panel('Доступні напрямки','map',`<div class="panel-body"><div class="map-steps">${[['Місто Варден','Безпечна зона','city'],['Темний ліс','Експедиції · 8 хв у дорозі','wood'],['Стара дорога','Експедиції · 12 хв у дорозі','map']].map(([name,detail,ic])=>`<div class="map-zone">${icon(ic,27)}<strong>${name}</strong><span>${detail}</span></div>`).join('')}</div><p class="help spaced">Часові значення умовні. Фізичних координат і реального пересування тут немає.</p></div>`)}
function renderStats(){return header('Аналітика / економіка','Статистика гільдії','Планований центр оцінки виробництва, витрат, продажів і стану героїв.','Умовні показники')+`<div class="metrics">${metric('Виручка за добу','420','coin','монет')}${metric('Витрати за добу','168','market','монет')}${metric('Чистий результат','+252','stats','монети')}${metric('Експедиції','11','map','')}</div><div class="content-grid"><div class="stack">${panel('Структура надходжень','stats',`<div class="panel-body"><div class="stat-bars">${[['Продаж ресурсів',70],['Виробництво',42],['Контракти',28]].map(([s,p])=>`<div class="stat-row"><span>${s}</span><div class="stat-track"><span style="width:${p}%"></span></div><strong>${p}%</strong></div>`).join('')}</div><p class="help spaced">Відсотки суто ілюстративні і не становлять реального фінансового звіту.</p></div>`)}</div><div class="stack">${panel('Економічні принципи','info',`<div class="panel-body"><div class="activity">${icon('warehouse')}<div><strong>Внутрішня економіка</strong><small>Розподіл запасів між героями й майстернями</small></div></div><div class="activity">${icon('market')}<div><strong>Зовнішня економіка</strong><small>Реальна торгівля між гільдіями</small></div></div></div>`)}</div></div>`}
function toast(message){document.getElementById('toast-root').innerHTML=`<div class="toast">${safe(message)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',4200)}
function modal(title,body){document.getElementById('modal-root').innerHTML=`<div class="overlay" id="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><h3 id="modaltitle">${safe(title)}</h3><p>${body}</p><div class="actions"><button class="button secondary" data-closemodal="1">Закрити</button></div></div></div>`;document.querySelector('[data-closemodal]').focus()}
function go(page){state.page=page;render();document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('show');window.scrollTo({top:0,behavior:'instant'})}
function openBuilding(target){let destination={tavern:['Таверна','Наймання героїв і відпочинок будуть окремою системою після затвердження механік.'],smith:['Коваль','Міські торгові послуги та ремонт обладнання ще не реалізовані.'],alchemist:['Алхімік','Закупівля зілля та інгредієнтів з’явиться у майбутній версії.'],bank:['Банк','Банківська механіка поки не затверджена.']}[target];if(destination)modal(...destination);else go(target)}
function addRecipe(id){let r=RECIPES.find(x=>x.id===id);if(!r)return;let missing=Object.entries(r.use).filter(([name,n])=>(state.inventory.find(v=>v.name===name)?.qty||0)<n);if(missing.length){toast('Недостатньо матеріалів: '+missing.map(([n])=>n).join(', '));return}for(const [name,n] of Object.entries(r.use))state.inventory.find(v=>v.name===name).qty-=n;state.production.push({name:r.name,time:r.time+' хв',status:'Заплановано'});toast('Демозамовлення додано. Матеріали списані зі складу.');render()}
function completeRecipe(i){let p=state.production[i];if(!p||p.status!=='Заплановано')return;let stock=state.inventory.find(v=>v.name===p.name);if(stock)stock.qty++;else state.inventory.push({name:p.name,category:'Готова продукція',qty:1,unit:'шт.'});state.production.splice(i,1);toast('Демовиробництво завершене: '+p.name);render()}
function commandToggle(){let flag=document.getElementById('commandSelect')?.value==='Купити предмет';let a=document.getElementById('purchaseField'),b=document.getElementById('priceField');if(a)a.hidden=!flag;if(b)b.hidden=!flag}
document.addEventListener('click',ev=>{let el=ev.target.closest('[data-nav],[data-building],[data-openhero],[data-recipe],[data-complete],[data-cancelorder],[data-removecommand],[data-modal],[data-closemodal],[data-demoquest]');if(!el){if(ev.target.id==='modal-overlay')document.getElementById('modal-root').innerHTML='';return}if(el.dataset.nav){go(el.dataset.nav);return}if(el.dataset.building){openBuilding(el.dataset.building);return}if(el.dataset.openhero!==undefined){state.hero=Number(el.dataset.openhero);go('heroes');return}if(el.dataset.recipe){addRecipe(el.dataset.recipe);return}if(el.dataset.complete!==undefined){completeRecipe(Number(el.dataset.complete));return}if(el.dataset.cancelorder!==undefined){state.orders.splice(Number(el.dataset.cancelorder),1);toast('Демозаявку скасовано');render();return}if(el.dataset.removecommand!==undefined){state.commands[state.hero].splice(Number(el.dataset.removecommand),1);render();return}if(el.dataset.modal){modal({inventory:'Інвентар героя',equip:'Екіпірування',skills:'Навички'}[el.dataset.modal], 'Цей розділ буде деталізовано після погодження характеристик героїв та слотів.');return}if(el.dataset.closemodal){document.getElementById('modal-root').innerHTML='';return}if(el.dataset.demoquest){modal(el.dataset.demoquest,'Завдання наведене для демонстрації інтерфейсу. Систему прийняття та виконання контрактів ще не підключено.');return}});
document.addEventListener('submit',ev=>{if(ev.target.id==='commandForm'){ev.preventDefault();let f=new FormData(ev.target),cmd=f.get('cmd');if(cmd==='Купити предмет'){let item=String(f.get('item')||'').trim(),price=Number(f.get('maxprice'));if(!item||!(price>0)){toast('Вкажіть назву товару й максимальну ціну');return}cmd=`Купити «${item}» (до ${price} монет)`}state.commands[state.hero].push(cmd);toast('Наказ додано до локальної черги');render()}if(ev.target.id==='marketForm'){ev.preventDefault();let f=new FormData(ev.target),qty=Number(f.get('qty')),price=Number(f.get('price'));if(!Number.isSafeInteger(qty)||qty<1||!Number.isSafeInteger(price)||price<1){toast('Перевір кількість і ціну');return}state.orders.push({type:String(f.get('type')),item:String(f.get('item')),qty,price});toast('Демонстраційну заявку створено без реальної торгівлі');render()}});
document.addEventListener('change',ev=>{if(ev.target.id==='commandSelect'){commandToggle()}if(ev.target.id==='marketFilter'){state.showMarket=ev.target.value;render()}if(ev.target.dataset.policy){state.policies[ev.target.dataset.policy]=ev.target.checked;save();toast('Налаштування збережено лише в цьому браузері')}});
document.addEventListener('input',ev=>{if(ev.target.id==='warehouseSearch'){state.filter=ev.target.value;let rows=document.getElementById('warehouseRows');if(rows)rows.innerHTML=renderWarehouseRows(state.inventory.filter(x=>x.name.toLocaleLowerCase('uk-UA').includes(state.filter.toLocaleLowerCase('uk-UA'))));save()}});
document.getElementById('menu').innerHTML=icon('menu');document.getElementById('menu').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('shade').classList.toggle('show')});document.getElementById('shade').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('show')});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){document.getElementById('modal-root').innerHTML='';document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('show')}});
render();
</script>
</body>
</html>
