.readiness-range{position:absolute;inset:0 0 auto;width:100%;height:32px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;pointer-events:none;cursor:pointer}
.readiness-range--returnEnergy{z-index:4}
.readiness-range--readyEnergy,.readiness-range--readyHP,.readiness-range--readyMP{z-index:3}
.readiness-range::-webkit-slider-runnable-track{height:9px;background:transparent}
.readiness-range::-moz-range-track{height:9px;background:transparent}
.readiness-range::-webkit-slider-thumb{width:24px;height:24px;margin-top:-8px;-webkit-appearance:none;appearance:none;border:3px solid #d1ab6b;background:#443522;border-radius:50%;box-shadow:0 0 0 2px #161a1b;pointer-events:auto;cursor:grab}
.readiness-range::-moz-range-thumb{width:19px;height:19px;border:3px solid #d1ab6b;background:#443522;border-radius:50%;box-shadow:0 0 0 2px #161a1b;pointer-events:auto;cursor:grab}
.readiness-range--returnEnergy::-webkit-slider-thumb{border-color:#dc9080;background:#512f2b}
.readiness-range--returnEnergy::-moz-range-thumb{border-color:#dc9080;background:#512f2b}
.readiness-range:focus-visible{outline:2px solid #e9be77;outline-offset:3px}
.readiness-legends{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:8px;font-size:11px;color:var(--muted)}
.readiness-legend{display:inline-flex;align-items:center;gap:5px}
.readiness-legend i{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#d1ab6b}
.readiness-legend--returnEnergy i{background:#dc9080}
.readiness-legend output{font-size:12px;font-weight:700;color:#f2e1c4}
.readiness-save-row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-top:10px}
.readiness-save-row small{flex:1;min-width:160px;font-size:10px;line-height:1.4;color:var(--muted)}
.readiness-save-row .hero-guide-save{margin:0}
@media(max-width:420px){.readiness-meter{padding:9px}.readiness-save-row .hero-guide-save{width:100%}}
</style>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Головна навігація">
    <div class="brand"><div class="brand-title">Riskfate</div><div class="brand-sub">The Living Guild</div><div class="brand-divider"></div></div>
    <div class="section-label">Навігація</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer"><strong>Прототип інтерфейсу · v0.1</strong>Локальна демонстрація. Дані та події умовні, онлайн-сервер не підключений.</div>
  </aside>
  <div class="mobile-shade" id="shade"></div>
  <div class="main-shell">
    <header class="topbar">
      <div class="breadcrumb"><button class="menu-btn" id="menu" aria-label="Відкрити навігацію"></button><span class="page-glyph" id="pageglyph"></span><span class="top-title" id="pagetitle"></span></div>
      <div class="wallet"><span class="wallet-item" id="goldbadge"></span><span class="wallet-item" id="resbadge"></span><div class="profile" title="Профіль гільдії">С</div></div>
    </header>

    <main class="layout" id="main"></main>
  </div>
</div>
<div id="toast-root" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<script>
'use strict';
const icons={
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',city:'<path d="M3 21V9l4-2 4 2v12M11 21V5l5-2 5 2v16M2 21h20M6 12h2M6 16h2M15 8h2M15 12h2M15 16h2"/>',guild:'<path d="m4 21 1-13 7-5 7 5 1 13M3 21h18M9 21v-8h6v8M8 9h.01M16 9h.01"/>',heroes:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 11a3 3 0 0 0 0-6M17 14a5 5 0 0 1 4 5v1"/>',warehouse:'<path d="m3 8 9-5 9 5v13H3zM3 8l9 5 9-5M12 13v8M7 10v3"/>',production:'<path d="M3 21h18M5 21V9l6 4V9l6 4V5h4v16M8 17h1M13 17h1M18 17h1"/>',market:'<path d="M4 10h16l-1-6H5zM4 10v11h16V10M9 21v-7h6v7M2 10h20"/>',quests:'<path d="M7 3h10v18H7zM10 3v4h4V3M10 12h4M10 16h4"/>',map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/>',stats:'<path d="M4 21v-7h4v7M10 21V9h4v12M16 21V4h4v17M2 21h20"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M14.5 8.5H11a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4H9.5M12 6v12"/>',gem:'<path d="m12 2 8 8-8 12L4 10zM4 10h16M12 2v20"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2"/>',shop:'<path d="M4 10h16l-1-6H5zM4 10v11h16V10M9 21v-7h6v7"/>',beer:'<path d="M5 6h12v14H5zM17 9h2a3 3 0 0 1 0 6h-2M8 3v3M12 3v3"/>',anvil:'<path d="M3 9h18M5 9l3 7h8l3-7M10 16v5M14 16v5M8 21h8"/>',flask:'<path d="M9 3h6M10 3v7L4 20h16l-6-10V3M7 16h10"/>',shield:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/>',bank:'<path d="m2 9 10-6 10 6M3 9h18M5 10v9M10 10v9M14 10v9M19 10v9M2 21h20"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',gate:'<path d="M4 21V9h4V5h8v4h4v12M2 21h20M9 21v-7a3 3 0 0 1 6 0v7"/>',sword:'<path d="m15 3 6 6-10 10-6-6zM5 13l-3 3M8 16l-3 5M2 16l6 6"/>',package:'<path d="m3 7 9-4 9 4v10l-9 4-9-4zM3 7l9 5 9-5M12 12v9"/>',arrow:'<path d="M4 12h16m-7-7 7 7-7 7"/>',spark:'<path d="m12 2 2 7 7 3-7 2-2 8-2-8-7-2 7-3z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.9 4.9 7 7m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',wood:'<path d="m12 2 7 9h-4l5 7H4l5-7H5zM12 18v4"/>',check:'<path d="m4 12 5 5L20 6"/>',plus:'<path d="M12 4v16M4 12h16"/>',cross:'<path d="M5 5l14 14M19 5 5 19"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',chest:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 13h18M10 13v4h4v-4M6 8V5a6 6 0 0 1 12 0v3"/>',up:'<path d="M5 15 12 8l7 7"/>',down:'<path d="m5 9 7 7 7-7"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',scroll:'<path d="M8 3h12v14a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h2zM8 3v14a3 3 0 0 1-3 3M11 8h6M11 12h6"/>'};
function icon(name,size=18){return `<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[name]||icons.info}</svg>`}
// Тимчасові назви для демонстраційного інтерфейсу; не затверджені назви світу.
const HUNTING_ZONES=[
 ['zone-forest','Лісові стежки','Лісова околиця','1–5'],
 ['zone-ridge','Кам’яний кряж','Скелясті схили','6–10'],
 ['zone-dark','Чорні хащі','Темні хащі','11–20']
];
const NAV=[['city','Місто','city'],...HUNTING_ZONES.map(([id,label])=>[id,label,'map'])];
const buildings=[
 ['shield','Гільдія','Герої, групи, склад та управління','guild'],
 ['spark','Точка призову','Призов кандидатів і воскресіння','summon'],
 ['beer','Таверна','Кандидати та найм для гільдії','tavern'],
 ['market','Ринок','Торгівля між гравцями','market'],
 ['bank','Банк','Майбутні фінансові послуги','bank'],
 ['mail','Дошка оголошень','Завдання та замовлення','quests'],
 ['gate','Міська брама','Перехід до напрямків світу','map']
];
const BUILDING_CATALOG=[
 ['anvil','Кузня','Виробництво, послуги та спорядження вищих рангів','smith'],
 ['flask','Алхімічна майстерня','Алхімічні послуги та зілля','alchemist'],
 ['shop','Крамниця спорядження','Предмети та екіпірування вищих рангів','equipment'],
 ['spark','Магазин навичок','Навички вищих рангів','skills'],
 ['package','Крамниця припасів','Витратні предмети для експедицій','supplies']
];
const HEROES=[{name:'Торен',cls:'Воїн',level:8,state:'Полює · Темний ліс',hp:72,mp:35,mpmax:60,command:[]},{name:'Еліра',cls:'Мисливиця',level:6,state:'Повертається до міста',hp:46,mp:38,mpmax:50,command:[]},{name:'Бран',cls:'Збирач',level:4,state:'Відпочиває у таверні',hp:91,mp:22,mpmax:40,command:[]}];
// UI preview options only; these are not an approved exhaustive list of weapon types.
const RPG_MASTERY_WEAPON_PREVIEW=[
 ['sword','Меч'],
 ['bow','Лук'],
 ['staff','Посох']
];
const DEMO_HERO_NEEDS=[[64,81],[23,57],[88,69]];
const INITIAL_INVENTORY=[['Залізна руда','Сировина',86,'шт.'],['Деревина','Сировина',48,'шт.'],['Лікарські трави','Сировина',34,'шт.'],['Шкіра вовка','Трофеї',21,'шт.'],['Малий еліксир здоров’я','Витратні',12,'шт.'],['Залізний меч','Спорядження',3,'шт.'],['Шкіряний обладунок','Спорядження',2,'шт.']];
const RECIPES=[{id:'sword',name:'Залізний меч',cost:'4 залізної руди · 2 деревини',use:{'Залізна руда':4,'Деревина':2},time:12,icon:'sword'},{id:'potion',name:'Малий еліксир здоров’я',cost:'3 лікарські трави',use:{'Лікарські трави':3},time:7,icon:'flask'},{id:'armor',name:'Шкіряний обладунок',cost:'5 шкур вовка',use:{'Шкіра вовка':5},time:18,icon:'shield'}];

/* Local UI preview only. Individual instructions never run the game simulation. */
const HERO_ARCHETYPE_EXAMPLES=[['fighter','Воїн'],['tank','Танк'],['ranger','Стрілець'],['support','Підтримка']];
const HERO_BUY_POLICIES=[
 ['weapon','Базова зброя'],
 ['armor','Базове екіпірування'],
 ['supplies','Придбання припасів']
];
const HERO_THRESHOLD_KEYS=['readyHP','readyMP','readyEnergy','returnEnergy'];
function initialHeroInstructions(){
 return {archetype:'',readyHP:'',readyMP:'',readyEnergy:'',returnEnergy:'',
  purchases:{weapon:'on',armor:'on',supplies:''},goals:[]};
}
function normalizeHeroInstructions(value){
 const result=initialHeroInstructions();
 if(!value||typeof value!=='object'||Array.isArray(value))return result;
 if(HERO_ARCHETYPE_EXAMPLES.some(([id])=>id===value.archetype))result.archetype=value.archetype;
 for(const k of HERO_THRESHOLD_KEYS){
  const v=String(value[k]??'').trim();
  if(v!==''&&/^\d+(?:\.\d+)?$/.test(v)&&Number.isFinite(Number(v)))result[k]=v;
 }
 if(result.readyEnergy!==''&&result.returnEnergy!==''&&Number(result.readyEnergy)<=Number(result.returnEnergy)){
  result.readyEnergy='';result.returnEnergy='';
 }
 for(const [key] of HERO_BUY_POLICIES){
  if(['on','off'].includes(value.purchases?.[key]))result.purchases[key]=value.purchases[key];
  else if(key==='supplies')result.purchases[key]='';
 }
 if(Array.isArray(value.goals))result.goals=value.goals.filter(x=>x&&typeof x==='object'&&['item','upgrade','skill'].includes(x.type)&&typeof x.name==='string'&&x.name.trim()).map(x=>({type:x.type,name:x.name.trim().slice(0,60)}));
 return result;
}

const initial=()=>({page:'city',hero:0,heroTab:'overview',masteryPreviewTypes:Array(HEROES.length).fill(''),heroInstructions:Array.from({length:HEROES.length},initialHeroInstructions),inventory:INITIAL_INVENTORY.map(([name,category,qty,unit])=>({name,category,qty,unit})),production:[{name:'Заточування мечів',time:'8 хв',status:'У роботі'}],orders:[],commands:[[],[],[]],activity:[{name:'З’явилося нове замовлення на ринку',time:'10 хв тому'},{name:'У таверні доступні нові найманці',time:'27 хв тому'},{name:'Зміна ціни на залізну руду',time:'1 год тому'},{name:'Прибула караванна група',time:'2 год тому'}],policies:{autosell:true,autobuy:false},guildGold:1840,filter:'',showMarket:'all',addedBuildings:[],zone:'zone-forest',heroesExpanded:true});
let state=initial();try{const raw=JSON.parse(localStorage.getItem('riskfate_ui_demo_v01')||'null');if(raw&&typeof raw==='object'){state={...state,...raw,page:NAV.some(n=>n[0]===raw.page)?raw.page:(['hunting','zone'].includes(raw.page)&&HUNTING_ZONES.some(z=>z[0]===raw.zone)?raw.zone:'city')};state.commands=Array.isArray(raw.commands)&&raw.commands.length===3?raw.commands:[[],[],[]];state.addedBuildings=Array.isArray(raw.addedBuildings)?[...new Set(raw.addedBuildings.filter(id=>BUILDING_CATALOG.some(x=>x[3]===id)))]:[];state.zone=['zone-forest','zone-ridge','zone-dark'].includes(raw.zone)?raw.zone:'zone-forest';state.heroesExpanded=raw.heroesExpanded!==false;state.masteryPreviewTypes=Array.from({length:HEROES.length},(_,i)=>RPG_MASTERY_WEAPON_PREVIEW.some(([key])=>key===raw.masteryPreviewTypes?.[i])?raw.masteryPreviewTypes[i]:'');}}catch(_e){}
state.heroInstructions=Array.from({length:HEROES.length},(_,i)=>normalizeHeroInstructions(state.heroInstructions?.[i]));
if(!['overview','orders'].includes(state.heroTab))state.heroTab='overview';
if(!Number.isInteger(state.hero)||state.hero<0||state.hero>=HEROES.length)state.hero=0;
function save(){try{localStorage.setItem('riskfate_ui_demo_v01',JSON.stringify(state))}catch(_e){}}
function money(n){return Number(n).toLocaleString('uk-UA')}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function metric(label,value,sym,detail){return `<div class="metric"><div class="metric-top"><span>${label}</span>${icon(sym,17)}</div><strong>${value}<em>${detail||''}</em></strong></div>`}
function header(eyebrow,title,sub,tag=''){return `<div class="heading-row"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${tag?`<span class="small-tag">${tag}</span>`:''}</div>`}
function panel(title,ico,body,action=''){return `<section class="panel"><div class="panel-head"><h2>${icon(ico)}${title}</h2>${action}</div>${body}</section>`}
function renderNav(){
 const inCity=!HUNTING_ZONES.some(z=>z[0]===state.page);
 const content=NAV.map(([id,label,ic])=>{
  const active=id===state.page||(id==='city'&&inCity);
  return `<button type="button" class="nav-button ${active?'active':''}" data-nav="${id}" ${active?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`;
 }).join('');
 document.getElementById('nav').innerHTML=content;
 document.getElementById('mobilemainnav').innerHTML=content;
}
function render(){
 renderNav();
 const pageMeta={guild:['Гільдія','guild'],heroes:['Герої','heroes'],warehouse:['Склад','warehouse'],production:['Виробництво','production'],market:['Ринок','market'],quests:['Завдання','quests'],map:['Карта','map'],stats:['Статистика','stats'],summon:['Точка призову','spark'],tavern:['Таверна','beer'],zone:['Зона полювання','map']};
 let entry=NAV.find(n=>n[0]===state.page)||[state.page,...(pageMeta[state.page]||['Місто','city'])];
 document.getElementById('pagetitle').textContent=entry[1];
 document.getElementById('pageglyph').innerHTML=icon(entry[2],25);
 document.getElementById('goldbadge').innerHTML=icon('coin')+money(state.guildGold);
 document.getElementById('resbadge').innerHTML=icon('heroes')+HEROES.length;
 document.getElementById('main').innerHTML=(HUNTING_ZONES.some(z=>z[0]===state.page)?renderHuntingZone:({city:renderCity,guild:renderGuild,heroes:renderHeroes,warehouse:renderWarehouse,production:renderProduction,market:renderMarket,quests:renderQuests,map:renderMap,stats:renderStats,summon:renderSummon,tavern:renderTavern}[state.page]||renderCity))();
 save()
}
function cityBuildings(){
 const current=buildings.concat(BUILDING_CATALOG.filter(b=>state.addedBuildings.includes(b[3])));
 const items=current.map(([ico,name,description,target])=>'<button class="city-card" type="button" data-building="'+target+'"><span class="city-card-icon" aria-hidden="true">'+icon(ico,25)+'</span><span class="city-card-copy"><strong>'+safe(name)+'</strong><small>'+safe(description)+'</small>'+(state.addedBuildings.includes(target)?'<span class="city-preview-tag">Додано для тесту</span>':'')+'</span></button>').join('');
 return items+'<button class="city-card city-add" type="button" data-buildcatalog="1" aria-label="Додати будівлю"><span class="city-card-icon" aria-hidden="true">'+icon('plus',29)+'</span><span class="city-card-copy"><strong>Додати будівлю</strong><small>Відкрити каталог міських об’єктів</small></span></button>'
}
function miniHero(h,i){
 const location=h.state.includes('·')?h.state.split('·').slice(1).join('·').trim():h.state;
 const vals=[['HP',h.hp,'hp'],['MP',Math.round(h.mp/Math.max(1,h.mpmax)*100),'mp'],['Енергія',DEMO_HERO_NEEDS[i]?.[0]??65,'en'],['Ситість',DEMO_HERO_NEEDS[i]?.[1]??75,'food']];
 const bars=vals.map(([label,value,key])=>'<span class="mini-meter '+key+'" role="meter" aria-label="'+label+' '+safe(h.name)+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+value+'" title="'+label+': '+value+'%"><span style="width:'+Math.max(0,Math.min(100,value))+'%"></span></span>').join('');
 return '<button class="mini-hero" type="button" data-openhero="'+i+'" aria-label="'+safe(h.name)+'. '+safe(h.state)+'. Відкрити героя"><span class="mini-portrait" aria-hidden="true">'+safe(h.name.slice(0,1))+'</span><span class="mini-right"><span class="mini-bars">'+bars+'</span><span class="mini-location">'+icon('pin',12)+safe(location)+'</span></span></button>'
}
function heroMonitor(){return '<details class="panel hero-monitor" '+(state.heroesExpanded?'open':'')+'><summary class="panel-head"><h2>'+icon('heroes')+'Герої гільдії</h2><span class="hero-collapse-chevron">'+icon('down',18)+'</span></summary><div class="minihero-list">'+HEROES.map(miniHero).join('')+'</div><div class="panel-body minihero-note">Статичні демопоказники; симуляція ще не працює.</div></details>'}
function renderHuntingZone(){
 const zone=HUNTING_ZONES.find(z=>z[0]===state.page)||HUNTING_ZONES[0];
 return header('Світ / локації',zone[1],safe(zone[2])+' · Демонстраційна локація. Параметри ще не затверджені.')+
 panel('Монстри та навички','info','<div class="panel-body"><div class="rowline"><div class="details"><strong>Рівні монстрів</strong><small>Умовний діапазон</small></div><strong>'+safe(zone[3])+'</strong></div><p class="help spaced">Відомості про монстрів, їхні навички та нагороди будуть додані окремо. Цей екран поки є інформаційним макетом.</p></div>');
}
function renderSummon(){
 return '<button type="button" class="button secondary back-city" data-nav="city">← Місто</button>'+header('Місто / точка призову','Точка призову','Окремий міський об’єкт, пов’язаний із гільдією.')+
 '<div class="content-grid"><div class="stack">'+panel('Призов кандидатів','spark','<div class="panel-body"><p>Гільдія оплачує призов; кандидати після нього переходять до таверни своєї гільдії.</p><p class="help spaced">Вибір рангу, кількості кандидатів, їхні параметри й оплата будуть реалізовані після погодження чисел.</p><button type="button" disabled class="button secondary spaced">Призвати героя — ще не реалізовано</button></div>')+'</div><div class="stack">'+panel('Воскресіння героїв','heroes','<div class="panel-body"><p>Після смерті той самий герой воскресає в точці призову й повертається до свого алгоритму без повторного найму.</p><p class="help spaced">Список загиблих героїв і таймери ще не підключені.</p></div>')+'</div></div>'

const READINESS_RANGE_PLACEHOLDERS={readyHP:50,readyMP:50,readyEnergy:75,returnEnergy:25};
function readinessPercent(p,key){
 const raw=String(p[key]??'').trim();
 if(raw!==''&&/^\d+(?:\.\d+)?$/.test(raw)&&Number(raw)<=100)return Math.round(Number(raw));
 return null;
}
function readinessScale(p,kind,title,current,keys){
 const sliders=keys.map(([key,label])=>{
  const configured=readinessPercent(p,key);
  const pos=configured===null?READINESS_RANGE_PLACEHOLDERS[key]:configured;
  return `<input type="range" class="readiness-range readiness-range--${key}" id="readinessSlider_${key}" name="${key}" min="${key==='readyEnergy'?1:0}" max="${key==='returnEnergy'?99:100}" step="1" value="${pos}" data-readiness-key="${key}" data-unset="${configured===null?'1':'0'}" aria-label="${safe(label)} у відсотках">`;
 }).join('');
 const legend=keys.map(([key,label])=>{
  const val=readinessPercent(p,key);
  return `<span class="readiness-legend readiness-legend--${key}"><i aria-hidden="true"></i>${safe(label)}: <output id="readinessValue_${key}" for="readinessSlider_${key}">${val===null?'—':val+'%'}</output></span>`;
 }).join('');
 return `<div class="readiness-meter readiness-meter--${kind}">
  <div class="readiness-meter-top"><strong>${safe(title)}</strong><span>Зараз ${current}% · демо</span></div>
  <div class="readiness-track" role="group" aria-label="${safe(title)}: пороги">
   <span class="readiness-track-bg"><span class="readiness-current-fill" style="width:${current}%"></span><span class="readiness-current-marker" style="left:${current}%" title="Зараз ${current}%"></span></span>
   ${sliders}
  </div>
  <div class="readiness-legends">${legend}</div>
 </div>`;
}
function updateReadinessSlider(input){
 const key=input.dataset.readinessKey;
 if(!HERO_THRESHOLD_KEYS.includes(key))return;
 let val=Math.round(Number(input.value));
 if(key==='readyEnergy'||key==='returnEnergy'){
  const other=document.getElementById('readinessSlider_'+(key==='readyEnergy'?'returnEnergy':'readyEnergy'));
  if(other&&other.dataset.unset==='0'){
   if(key==='readyEnergy')val=Math.max(val,Number(other.value)+1);
   else val=Math.min(val,Number(other.value)-1);
  }
 }
 val=Math.max(key==='readyEnergy'?1:0,Math.min(key==='returnEnergy'?99:100,val));
 input.value=String(val);input.dataset.unset='0';
 const label=document.getElementById('readinessValue_'+key);
 if(label)label.textContent=val+'%';
 const status=document.getElementById('readinessDraft');
 if(status)status.textContent='Є незбережені зміни';
}

 if(item){
  const sample=item[2]?'Візуальний зразок: '+safe(item[2])+'. ':'';
  modal(item[0],sample+'Це макет квадратного RPG-слота. Предмет або навичка не додані до майна героя; остаточні типи й кількість слотів ще не затверджені.');
 }
 return
}
if(el.dataset.goalup!==undefined||el.dataset.goaldown!==undefined||el.dataset.goalremove!==undefined){
 const action=el.dataset.goalup!==undefined?'up':el.dataset.goaldown!==undefined?'down':'remove';
 const index=Number(action==='up'?el.dataset.goalup:action==='down'?el.dataset.goaldown:el.dataset.goalremove);
 const goals=state.heroInstructions[state.hero].goals;
 if(!Number.isInteger(index)||index<0||index>=goals.length)return;
 if(action==='remove')goals.splice(index,1);
 else{
  const other=index+(action==='up'?-1:1);
  if(other<0||other>=goals.length)return;
  [goals[index],goals[other]]=[goals[other],goals[index]];
 }
 save();
 const list=document.getElementById('heroGoalsList');
 if(list)list.innerHTML=heroGoalsRows();
 return
}
if(el.dataset.recipe){addRecipe(el.dataset.recipe);return}if(el.dataset.complete!==undefined){completeRecipe(Number(el.dataset.complete));return}if(el.dataset.cancelorder!==undefined){state.orders.splice(Number(el.dataset.cancelorder),1);toast('Демозаявку скасовано');render();return}if(el.dataset.removecommand!==undefined){state.commands[state.hero].splice(Number(el.dataset.removecommand),1);render();return}if(el.dataset.modal){modal({inventory:'Інвентар героя',equip:'Екіпірування',skills:'Навички'}[el.dataset.modal], 'Цей розділ буде деталізовано після погодження характеристик героїв та слотів.');return}if(el.dataset.closemodal){document.getElementById('modal-root').innerHTML='';return}if(el.dataset.demoquest){modal(el.dataset.demoquest,'Завдання наведене для демонстрації інтерфейсу. Систему прийняття та виконання контрактів ще не підключено.');return}});
document.addEventListener('submit',ev=>{
 if(ev.target.id==='heroReadinessForm'){
  ev.preventDefault();
  const values={};
  for(const key of HERO_THRESHOLD_KEYS){
   const slider=document.getElementById('readinessSlider_'+key);
   if(!slider){toast('Шкалу не знайдено');return}
   if(slider.dataset.unset==='1'){values[key]='';continue}
   const n=Number(slider.value);
   if(!Number.isInteger(n)||n<0||n>100){toast('Поріг має бути від 0 до 100%');return}
   values[key]=String(n);
  }
  if((values.readyEnergy==='')!==(values.returnEnergy==='')){toast('Встанови обидві межі енергії');return}
  if(values.readyEnergy!==''&&Number(values.readyEnergy)<=Number(values.returnEnergy)){toast('Початок має бути вище повернення');return}
  Object.assign(state.heroInstructions[state.hero],values);
  save();
  const status=document.getElementById('readinessDraft');
  if(status)status.textContent='Межі збережено для цього героя · демо';
  toast('Межі збережено в браузері');return;
 }
 if(ev.target.id==='heroGoalForm'){
  ev.preventDefault();
  const data=new FormData(ev.target),type=String(data.get('type')||'item'),name=String(data.get('name')||'').trim();
  if(!['item','upgrade','skill'].includes(type)||!name||name.length>60){toast('Вкажи коректну назву цілі до 60 символів');return}
  state.heroInstructions[state.hero].goals.push({type,name});
  save();
  const list=document.getElementById('heroGoalsList');if(list)list.innerHTML=heroGoalsRows();
  ev.target.reset();
  toast('Ціль додано до особистої демочерги');return;
 }
 if(ev.target.id==='commandForm'){ev.preventDefault();let f=new FormData(ev.target),cmd=f.get('cmd');if(cmd==='Купити предмет'){let item=String(f.get('item')||'').trim(),price=Number(f.get('maxprice'));if(!item||!(price>0)){toast('Вкажіть назву товару й максимальну ціну');return}cmd=`Купити «${item}» (до ${price} монет)`}state.commands[state.hero].push(cmd);toast('Наказ додано до локальної черги');render()}if(ev.target.id==='marketForm'){ev.preventDefault();let f=new FormData(ev.target),qty=Number(f.get('qty')),price=Number(f.get('price'));if(!Number.isSafeInteger(qty)||qty<1||!Number.isSafeInteger(price)||price<1){toast('Перевір кількість і ціну');return}state.orders.push({type:String(f.get('type')),item:String(f.get('item')),qty,price});toast('Демонстраційну заявку створено без реальної торгівлі');render()}});
document.addEventListener('toggle',ev=>{if(ev.target.matches('details.hero-monitor')){state.heroesExpanded=ev.target.open;save()}},true);
document.addEventListener('change',ev=>{if(ev.target.id==='commandSelect'){commandToggle()}if(ev.target.id==='masteryWeaponType'){const chosen=ev.target.value;if(chosen===''||RPG_MASTERY_WEAPON_PREVIEW.some(([key])=>key===chosen)){state.masteryPreviewTypes[state.hero]=chosen;save();const label=document.getElementById('masterySelectionLabel');if(label)label.textContent='Перегляд: '+rpgSelectedWeaponName(chosen)}}if(ev.target.id==='heroArchetypeSelect'){
 const archetype=ev.target.value;
 if(archetype===''||HERO_ARCHETYPE_EXAMPLES.some(([id])=>id===archetype)){
  state.heroInstructions[state.hero].archetype=archetype;save();
  toast('Архетип збережено лише в демонстраційних налаштуваннях');
 }
}
if(ev.target.dataset.heroPolicy){
 const key=ev.target.dataset.heroPolicy,val=ev.target.value;
 if(HERO_BUY_POLICIES.some(([id])=>id===key)&&['','on','off'].includes(val)){
  state.heroInstructions[state.hero].purchases[key]=val;save();
  toast('Правило автозакупівлі збережено локально');
 }
}
if(ev.target.id==='marketFilter'){state.showMarket=ev.target.value;render()}if(ev.target.dataset.policy){state.policies[ev.target.dataset.policy]=ev.target.checked;save();toast('Налаштування збережено лише в цьому браузері')}});
document.addEventListener('input',ev=>{if(ev.target.dataset?.readinessKey)updateReadinessSlider(ev.target);if(ev.target.id==='warehouseSearch'){state.filter=ev.target.value;let rows=document.getElementById('warehouseRows');if(rows)rows.innerHTML=renderWarehouseRows(state.inventory.filter(x=>x.name.toLocaleLowerCase('uk-UA').includes(state.filter.toLocaleLowerCase('uk-UA'))));save()}});
document.getElementById('menu').innerHTML=icon('menu');document.getElementById('menu').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('shade').classList.toggle('show')});document.getElementById('shade').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('show')});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){document.getElementById('modal-root').innerHTML='';document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('show')}});
render();
</script>
</body>
</html>
